---
stages:
  - "lint"
  - "test"

variables:
  # Used by GitLab to initialise the postgres service container (example-test)
  POSTGRES_DB: cosmo_template
  POSTGRES_USER: cosmo_template_user
  POSTGRES_PASSWORD: test
  POSTGRES_HOST_AUTH_METHOD: trust
  # Used by the minio service variables block below
  OBJECT_STORAGE_ACCESS_KEY: "accesskey"
  OBJECT_STORAGE_SECRET_KEY: "secretkey"

# =========================================================================
# Framework (root package: cosmo_framework/)
# =========================================================================

framework-lint:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run ruff format --check cosmo_framework test"
    - "uv run ruff check cosmo_framework test"

# Gate: the framework package must stay domain-free (no CSV-profiler references).
# The CSV profiler lives in examples/csv_profiler/ and depends on the framework.
domain-free:
  stage: "lint"
  image: "python:3.13"
  script:
    - |
      if grep -rnE --include='*.py' 'csv_profiler|ProfileConfig|computation_module|validate_csv|profile_csv|CSV_UPLOAD' cosmo_framework/ ; then
        echo "ERROR: domain (CSV-profiler) reference found in cosmo_framework/ — the framework package must stay domain-free."
        exit 1
      fi
      echo "OK: cosmo_framework/ is domain-free."

# Framework-scope tests (static id enforcement, etc.) — no services needed.
framework-test:
  stage: "test"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run pytest test/ -v"

# =========================================================================
# Example app (examples/csv_profiler/) — consumes the framework
# =========================================================================

example-lint:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "cd examples/csv_profiler"
    - "uv sync"
  script:
    - "uv run ruff format --check ."
    - "uv run ruff check ."

example-test:
  stage: "test"
  image: "python:3.13"
  services:
    - name: "postgres:17"
      alias: postgres
    - name: "minio/minio:latest"
      alias: minio
      command: ["server", "/data", "--console-address", ":9001"]
      variables:
        MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY}"
        MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY}"
    - name: "redis:7-alpine"
      alias: redis
  before_script:
    - apt-get update && apt-get install -y postgresql-client curl rclone
    - cd examples/csv_profiler
    - "cp env_ci .env"
    - "source .env"
    - "rclone config create minio s3 provider=Minio access_key_id=${OBJECT_STORAGE_ACCESS_KEY} secret_access_key=${OBJECT_STORAGE_SECRET_KEY} endpoint=${OBJECT_STORAGE_HOST}"
    - "rclone mkdir minio:${OBJECT_STORAGE_BUCKET}"
    - "rclone lsd minio:"
    - "export PGPASSWORD=${POSTGRES_PASSWORD}"
    - "psql -h ${POSTGRES_HOST_NAME} -U ${POSTGRES_USER} -d ${POSTGRES_DB} < docker/init.sql"
    - "pip install uv"
    - "uv sync"
    - "uv run playwright install --with-deps chromium"
    - "mkdir -p test/artifacts"
  script:
    - uv run pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - examples/csv_profiler/test/artifacts/
