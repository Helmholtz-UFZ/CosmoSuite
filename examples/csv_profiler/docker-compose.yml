# Host-published ports are parameterised as ${…_HOST_PORT:-<today's value>} so that
# the three sister stacks (cosmopolitan, cosmonaut, csv_profiler) can run side by side
# on one machine — see cosmo-suite/docs/plan/local-port-allocation.md for the
# allocation. With none of these variables set the resolved mappings are identical to
# before, so CI and production are untouched.
# Note the asymmetry: the left side is the *host* port, the right side stays fixed,
# because that is what the service listens on inside the compose network. The
# app-facing POSTGRES_PORT / REDIS_PORT / OBJECT_STORAGE_HOST answer a different
# question ("where does the app connect to") and must not be reused here.
# FLASK_PORT is the exception: it keeps its double role (the port the app binds inside
# the container *and* the port the Dash test server binds outside Docker), so the
# webserver mapping falls back to FLASK_PORT rather than to a literal. A literal
# default would publish 8080 for anyone who sets only FLASK_PORT — a mismatch that
# looks like the app not starting.
services:
  cosmo-suite:
    image: cosmo-suite-webserver
    container_name: cosmo-suite-webserver
    build:
      # Repo root: the example depends on cosmo-suite by local path, so the
      # framework source must be in the build context.
      context: ../..
      dockerfile: examples/csv_profiler/docker/dev.Dockerfile
      network: host
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_HOST_PORT:-${FLASK_PORT}}:${FLASK_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Mount the whole repo (framework + example live) for reload; the anonymous
      # volume preserves the image-built venv over the bind mount.
      - "../..:/python_docker/cosmo_suite"
      - "/python_docker/cosmo_suite/examples/csv_profiler/.venv"

  cosmo-suite-worker:
    image: cosmo-suite-worker
    container_name: cosmo-suite-worker
    build:
      context: ../..
      dockerfile: examples/csv_profiler/docker/worker.Dockerfile
      network: host
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Mount the whole repo (framework + example live) for reload; the anonymous
      # volume preserves the image-built venv over the bind mount.
      - "../..:/python_docker/cosmo_suite"
      - "/python_docker/cosmo_suite/examples/csv_profiler/.venv"

  redis:
    image: redis:7-alpine
    container_name: redis_cosmo_suite
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres_cosmo_suite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: minio_cosmo_suite
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001" # Web-based admin console
    environment:
      MINIO_ROOT_USER: accesskey
      MINIO_ROOT_PASSWORD: secretkey
    command: server /data --console-address ":9001"

volumes:
  redis_data:
