[project]
name = "csv-profiler"
version = "0.1.0"
description = "CSV statistical profiler — reference domain / example app for the Cosmo Framework"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.13"
dependencies = [
    # The shared framework. The concrete source (a local path for --local-core dev,
    # or a git+https tag for real deployments) is wired in commit 2b; see the README.
    "cosmo-framework",
    "dash-form-factory==0.1.9",
    "pandas>=2.0.0,<3",
    "numpy>=1.26.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "selenium>=4.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csv_profiler"]
