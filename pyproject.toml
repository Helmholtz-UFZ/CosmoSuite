[project]
name = "cosmo-framework"
version = "0.1.0"
description = "Shared Dash + Celery + PostgreSQL + MinIO application framework for the Cosmo Suite"
authors = [{ name = "John Anders", email = "john-eric.anders@ufz.de" }]
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.13"
dependencies = [
    "dash[ag-grid]>=3.0.4,<4",
    "dash-bootstrap-components>=2.0.3,<3",
    "celery[redis]>=5.3.0,<6",
    "python-dotenv>=1.0.0,<2",
    "psycopg2>=2.9.10,<3",
    "sqlalchemy>=2.0.41,<3",
    "coolname>=2.2.0,<3",
    "gunicorn>=23.0.0,<24",
    "pydantic>=2.0.0,<3",
    "dash-form-factory==0.1.9",
    "pandas>=2.0.0,<3",
    "numpy>=1.26.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "selenium>=4.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmo_framework"]
